<!-- fictional replica for security testing -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPay Standard Checkout Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f8fafc; color: #1e293b; display: flex; justify-content: center; padding: 20px; }
        .checkout-box { width: 100%; max-width: 440px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .merchant-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 16px; margin-bottom: 16px; }
        .merchant-name { font-size: 16px; font-weight: 700; color: #0f172a; }
        .total-due { font-size: 20px; font-weight: 800; color: #0284c7; }
        .pay-options h3 { font-size: 13px; text-transform: uppercase; color: #64748b; margin-bottom: 12px; }
        .option-card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; }
        .option-card.active { border-color: #0284c7; background: #f0f9ff; }
        .form-row { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .btn-pay { width: 100%; padding: 14px; background: #0284c7; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .security-badge { text-align: center; margin-top: 16px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="checkout-box">
        <div class="merchant-header">
            <div>
                <div class="merchant-name">State Bank of India Authorized Direct</div>
                <div style="font-size: 12px; color: #64748b;">Order #ORD-001131</div>
            </div>
            <div class="total-due">₹2697</div>
        </div>
        <div class="pay-options">
            <h3>Select Payment Method</h3>
            <div class="option-card active">
                <span>Credit / Debit Card</span>
                <span>💳</span>
            </div>
            <form action="/gateway/process" method="POST">
                <div class="form-row">
                    <label for="cnum">Card Number</label>
                    <input type="text" id="cnum" name="card_number" placeholder="4111 2222 3333 4444" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-row" style="flex: 1;">
                        <label for="exp">Expiry</label>
                        <input type="text" id="exp" name="expiry" placeholder="MM/YY" required>
                    </div>
                    <div class="form-row" style="flex: 1;">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" name="cvv" placeholder="•••" maxlength="3" required>
                    </div>
                </div>
                <button class="btn-pay" type="submit">Pay Securely ₹2697</button>
            </form>
        </div>
        <div class="security-badge">
            🔒 PCI-DSS Level 1 Compliant &bull; 256-Bit SSL Encryption
        </div>
    </div>
</body>
</html>
